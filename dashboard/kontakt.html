<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt – LocalAd</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue:    #2563eb;
      --blue-dk: #1d4ed8;
      --border:  #e2e8f0;
      --muted:   #64748b;
      --text:    #0f172a;
      --bg:      #f8fafc;
      --green:   #16a34a;
      --red:     #dc2626;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Nav */
    nav {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 20px; font-weight: 800; color: var(--blue); text-decoration: none; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { font-size: 14px; color: var(--muted); text-decoration: none; }
    .nav-links a:hover { color: var(--text); }

    /* Main */
    main { max-width: 560px; margin: 60px auto; padding: 0 20px; }

    h1 { font-size: 30px; font-weight: 800; margin-bottom: 8px; }
    .subtitle { font-size: 15px; color: var(--muted); margin-bottom: 40px; line-height: 1.6; }

    /* Form */
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    label { font-size: 13px; font-weight: 600; color: var(--muted); }
    input, textarea, select {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 15px; font-family: inherit; outline: none; background: #fff;
      color: var(--text);
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--blue); box-shadow: 0 0 0 3px #dbeafe;
    }
    textarea { resize: vertical; min-height: 140px; }

    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-primary:hover { background: var(--blue-dk); }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }

    /* Feedback */
    .feedback {
      display: none; border-radius: 8px; padding: 14px 16px;
      font-size: 14px; margin-bottom: 20px; line-height: 1.5;
    }
    .feedback.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; display: block; }
    .feedback.error   { background: #fef2f2; border: 1px solid #fecaca; color: var(--red);  display: block; }

    /* Footer */
    footer {
      text-align: center; padding: 40px 20px; font-size: 13px;
      color: var(--muted); border-top: 1px solid var(--border); margin-top: 80px;
    }
    footer a { color: var(--muted); text-decoration: none; margin: 0 8px; }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">LocalAd</a>
  <ul class="nav-links">
    <li><a href="/">Startseite</a></li>
    <li><a href="/onboarding">Jetzt starten</a></li>
    <li><a href="/impressum">Impressum</a></li>
  </ul>
</nav>

<main>
  <h1>Kontakt</h1>
  <p class="subtitle">
    Fragen zur Extension, zum Abo oder zur Werbung in Duisburg?<br>
    Wir antworten in der Regel innerhalb von 24 Stunden.
  </p>

  <div class="feedback" id="feedback"></div>

  <form id="contact-form" novalidate>
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Max Mustermann" autocomplete="name" required />
    </div>

    <div class="form-group">
      <label for="email">E-Mail-Adresse</label>
      <input type="email" id="email" name="email" placeholder="du@example.de" autocomplete="email" required />
    </div>

    <div class="form-group">
      <label for="subject">Betreff</label>
      <select id="subject" name="subject">
        <option value="allgemein">Allgemeine Anfrage</option>
        <option value="abo">Frage zum Abo</option>
        <option value="werbung">Werbung schalten</option>
        <option value="publisher">Als Publisher registrieren</option>
        <option value="technisch">Technisches Problem</option>
        <option value="presse">Presse / Kooperation</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">Nachricht</label>
      <textarea id="message" name="message" placeholder="Deine Nachricht..." required></textarea>
    </div>

    <button type="submit" class="btn btn-primary" id="submit-btn">Nachricht senden</button>
  </form>
</main>

<footer>
  <a href="/">LocalAd</a>
  <a href="/impressum">Impressum</a>
  <a href="/datenschutz">Datenschutz</a>
  <a href="/agb">AGB</a>
</footer>

<script>
  var form = document.getElementById('contact-form');
  var btn  = document.getElementById('submit-btn');
  var fb   = document.getElementById('feedback');

  function showFeedback(type, msg) {
    fb.className = 'feedback ' + type;
    fb.textContent = msg;
    fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    fb.className = 'feedback';

    var name    = document.getElementById('name').value.trim();
    var email   = document.getElementById('email').value.trim();
    var subject = document.getElementById('subject').value;
    var message = document.getElementById('message').value.trim();

    if (!name || !email || !message) {
      return showFeedback('error', 'Bitte alle Pflichtfelder ausfüllen.');
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      return showFeedback('error', 'Bitte eine gültige E-Mail-Adresse eingeben.');
    }

    btn.disabled = true;
    btn.textContent = 'Wird gesendet…';

    fetch('/api/contact', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, email: email, subject: subject, message: message }),
    })
    .then(function(res) {
      return res.json().then(function(data) {
        if (!res.ok) throw new Error(data.error || 'Fehler beim Senden.');
        return data;
      });
    })
    .then(function() {
      form.reset();
      showFeedback('success', 'Danke! Deine Nachricht wurde gesendet. Wir melden uns bald.');
    })
    .catch(function(err) {
      showFeedback('error', err.message || 'Fehler beim Senden. Bitte versuche es später erneut.');
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = 'Nachricht senden';
    });
  });
</script>

</body>
</html>
