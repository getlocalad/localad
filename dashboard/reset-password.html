<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passwort zurücksetzen – LocalAd</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0C2340;
      --blue:   #2563eb;
      --orange: #E85D04;
      --gray:   #f5f7fa;
      --gray2:  #e2e8f0;
      --text:   #18243a;
      --muted:  #64748b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--gray);
      color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(12,35,64,0.12);
      padding: 2.5rem 2rem;
      width: 100%; max-width: 420px;
    }

    .logo {
      font-size: 1.5rem; font-weight: 900;
      color: var(--navy); margin-bottom: 1.75rem;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--orange); }

    h1 { font-size: 1.4rem; font-weight: 900; color: var(--navy); margin-bottom: 0.4rem; }
    .subtitle { font-size: 0.9rem; color: var(--muted); margin-bottom: 1.75rem; line-height: 1.6; }

    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.35rem; }
    input {
      width: 100%; padding: 0.7rem 0.9rem;
      border: 1.5px solid var(--gray2); border-radius: 9px;
      font-size: 0.95rem; color: var(--text);
      outline: none; transition: border-color 0.2s;
    }
    input:focus { border-color: var(--orange); }

    .btn {
      width: 100%; padding: 0.82rem;
      border: none; border-radius: 9px;
      font-size: 0.97rem; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s; margin-top: 0.5rem;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      padding: 0.75rem 1rem; border-radius: 9px;
      font-size: 0.88rem; margin-bottom: 1rem;
      display: none;
    }
    .msg.error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
    .msg.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; display: block; }

    .back-link {
      display: block; text-align: center; margin-top: 1.25rem;
      font-size: 0.85rem; color: var(--muted); text-decoration: none;
    }
    .back-link:hover { color: var(--blue); }

    /* Anfrage-Modus (E-Mail eingeben) */
    #view-request  { display: block; }
    #view-reset    { display: none; }
    #view-done     { display: none; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Local<span>Ad</span></div>

  <!-- ── Schritt 1: E-Mail eingeben ── -->
  <div id="view-request">
    <h1>Passwort vergessen?</h1>
    <p class="subtitle">Gib deine E-Mail-Adresse ein – wir schicken dir einen Reset-Link.</p>
    <div class="msg" id="req-error"></div>
    <div class="form-group">
      <label>E-Mail-Adresse</label>
      <input type="email" id="req-email" placeholder="du@example.de" autocomplete="email" />
    </div>
    <button class="btn btn-primary" id="req-btn" onclick="submitRequest()">Link anfordern</button>
    <a href="/onboarding.html#login" class="back-link">← Zurück zum Login</a>
  </div>

  <!-- ── Schritt 2: Neues Passwort (wenn Token in URL) ── -->
  <div id="view-reset">
    <h1>Neues Passwort</h1>
    <p class="subtitle">Wähle ein neues Passwort für deinen LocalAd-Account.</p>
    <div class="msg" id="reset-error"></div>
    <div class="form-group">
      <label>Neues Passwort</label>
      <input type="password" id="reset-pw1" placeholder="Mindestens 8 Zeichen" autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label>Passwort wiederholen</label>
      <input type="password" id="reset-pw2" placeholder="Nochmals eingeben" autocomplete="new-password" />
    </div>
    <button class="btn btn-primary" id="reset-btn" onclick="submitReset()">Passwort speichern</button>
  </div>

  <!-- ── Schritt 3: Bestätigung ── -->
  <div id="view-done">
    <h1>✓ Passwort geändert</h1>
    <p class="subtitle" id="done-msg"></p>
    <a href="/onboarding.html" class="btn btn-primary" style="display:block;text-align:center;text-decoration:none;margin-top:1rem">
      Zum Login
    </a>
  </div>
</div>

<script>
var API = (function () {
  var h = window.location.hostname;
  return h === 'localhost' || h === '127.0.0.1'
    ? 'http://localhost:3000/api'
    : 'https://localad-production.up.railway.app/api';
})();

// Token aus URL lesen
var urlToken = new URLSearchParams(window.location.search).get('token');

// Wenn Token in URL → direkt Reset-View zeigen
if (urlToken) {
  document.getElementById('view-request').style.display = 'none';
  document.getElementById('view-reset').style.display   = 'block';
}

function showError(id, msg) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'msg error';
}

// ── Link anfordern ──────────────────────────────────────────────────────────
function submitRequest() {
  var email = document.getElementById('req-email').value.trim();
  var btn   = document.getElementById('req-btn');

  if (!email) return showError('req-error', 'Bitte E-Mail-Adresse eingeben.');

  btn.disabled    = true;
  btn.textContent = 'Wird gesendet…';

  fetch(API + '/auth/forgot-password', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ email: email }),
  })
    .then(function (r) { return r.json(); })
    .then(function () {
      document.getElementById('view-request').style.display = 'none';
      document.getElementById('view-done').style.display    = 'block';
      document.getElementById('done-msg').textContent =
        'Falls die E-Mail-Adresse bei uns registriert ist, bekommst du gleich eine Mail mit dem Reset-Link. Bitte prüfe auch deinen Spam-Ordner.';
    })
    .catch(function () {
      showError('req-error', 'Netzwerkfehler – bitte nochmal versuchen.');
      btn.disabled    = false;
      btn.textContent = 'Link anfordern';
    });
}

// ── Neues Passwort setzen ───────────────────────────────────────────────────
function submitReset() {
  var pw1 = document.getElementById('reset-pw1').value;
  var pw2 = document.getElementById('reset-pw2').value;
  var btn = document.getElementById('reset-btn');

  if (pw1.length < 8) return showError('reset-error', 'Passwort muss mindestens 8 Zeichen haben.');
  if (pw1 !== pw2)    return showError('reset-error', 'Passwörter stimmen nicht überein.');

  btn.disabled    = true;
  btn.textContent = 'Wird gespeichert…';

  fetch(API + '/auth/reset-password', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ token: urlToken, password: pw1 }),
  })
    .then(function (r) {
      if (!r.ok) return r.json().then(function (d) { throw new Error(d.error || 'Fehler'); });
      return r.json();
    })
    .then(function () {
      document.getElementById('view-reset').style.display = 'none';
      document.getElementById('view-done').style.display  = 'block';
      document.getElementById('done-msg').textContent =
        'Dein Passwort wurde erfolgreich geändert. Du kannst dich jetzt anmelden.';
    })
    .catch(function (e) {
      showError('reset-error', e.message || 'Fehler – bitte neu anfordern.');
      btn.disabled    = false;
      btn.textContent = 'Passwort speichern';
    });
}
</script>
<script src="/cookie-banner.js" defer></script>
</body>
</html>
